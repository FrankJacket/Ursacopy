name: Docker image

# Manual only: Actions > "Docker image" > Run workflow (workflow_dispatch, no automatic trigger).
# Runs the tests, then builds the image and pushes it to the GitHub Container Registry (ghcr.io/<owner>/ursacopy).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag of the image, e.g. 1.0.0 (a leading v is removed)"
        required: true
        default: "0.1.0"
      latest:
        description: "Also tag the image as latest"
        type: boolean
        default: true
      platforms:
        description: "Platforms to build (NAS boxes are amd64 or arm64)"
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Ursacopy.slnx -c Release

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags (the registry wants lower case)
        run: |
          v="${{ inputs.version }}"; v="${v#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ursacopy"
          tags="$image:$v"
          if [ "${{ inputs.latest }}" = "true" ]; then tags="$tags"$'\n'"$image:latest"; fi
          {
            echo "VERSION=$v"
            echo "TAGS<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.TAGS }}
      - name: Summary
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Run: \`docker pull ${TAGS%%$'\n'*}\`"
          } >> "$GITHUB_STEP_SUMMARY"
